---
# Déploiement de {{TITRE}} (v{{VERSION}}) — à lancer depuis Semaphore (ou ansible-playbook).
# Ordre : serveur de test d'abord, puis production, avec les mêmes fichiers.
# Variables à donner au lancement : cible (hôte) ; moteur (podman par défaut, ou docker).
# Ce playbook ne crée et ne lit aucun secret : le fichier .env doit déjà exister sur le serveur.
- name: Déployer {{TITRE}}
  hosts: "{{ cible }}"
  become: true
  gather_facts: false
  vars:
    app_nom: "{{NOM}}"
    app_version: "{{VERSION}}"
    app_dir: "/data/apps/{{NOM}}"
    conteneur: "{{NOM}}-app"
    moteur: podman                       # podman ou docker, selon le serveur
    commande_compose: "{{ 'docker compose' if moteur == 'docker' else 'podman compose' }}"
    fichiers_deploiement:                # pris à côté de ce playbook (dossier deploy/ du dépôt)
      - compose.yaml
      - "{{NOM}}.conf"
      - .env.exemple
    port_local: {{PORT}}
    chemin_sante: "/sante"               # adresse qui répond 200 quand l'application est prête (adapter)
    deploy_vhost: false                  # true seulement après avoir vérifié l'emplacement avec « nginx -T »
  tasks:
    - name: Le moteur de conteneurs est connu
      ansible.builtin.assert:
        that: moteur in ['podman', 'docker']
        fail_msg: "La variable « moteur » doit valoir podman ou docker."

    - name: Le dossier de l'application existe
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        mode: "0755"

    - name: Le fichier .env existe déjà (jamais créé par ce playbook)
      ansible.builtin.stat:
        path: "{{ app_dir }}/.env"
      register: env_fichier

    - name: Arrêt si .env est absent ou trop ouvert
      ansible.builtin.assert:
        that:
          - env_fichier.stat.exists
          - env_fichier.stat.mode == '0600'
        fail_msg: "Créer {{ app_dir }}/.env à partir de .env.exemple, puis chmod 600."

    - name: Poser les fichiers de déploiement
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/{{ item }}"
        dest: "{{ app_dir }}/{{ item }}"
        mode: "0644"
      loop: "{{ fichiers_deploiement }}"

    # L'étiquette « avant-maj » est posée sur le nom du dépôt seul (sans la version ni l'empreinte) : le « : » d'un
    # port de registre (registre.exemple.fr:5000/app:1.0) n'est donc pas pris pour celui de la version.
    # Elle n'est pas déplacée quand l'image en service est déjà celle que le compose.yaml va lancer (même version
    # rejouée : on perdrait la version précédente), ni quand l'image en service est déjà « avant-maj ».
    # Podman rend le nom complet (docker.io/library/nginx:1.27.3) là où le compose.yaml porte le nom court :
    # les deux sont ramenés au nom court avant d'être comparés.
    - name: Garder l'image en service sous l'étiquette de retour arrière
      ansible.builtin.shell: |
        set -e
        court() { local n="$1"; n="${n#docker.io/library/}"; n="${n#docker.io/}"; n="${n#localhost/}"; echo "$n"; }
        img=$({{ moteur }} inspect --format '{{ '{{' }}.Config.Image{{ '}}' }}' "{{ conteneur }}" 2>/dev/null || true)
        a_lancer=$(awk '$1 == "image:" { gsub(/[^A-Za-z0-9._:@\/-]/, "", $2); print $2; exit }' "{{ app_dir }}/compose.yaml")
        if [ -n "$img" ]; then
          depot="${img%%@*}"
          case "${depot##*/}" in *:*) depot="${depot%:*}" ;; esac
          retour="$depot:avant-maj"
          if [ "$(court "$img")" = "$(court "$a_lancer")" ] || [ "$img" = "$retour" ]; then
            echo "Étiquette avant-maj laissée telle quelle : l'image en service est déjà celle à lancer ou déjà avant-maj."
          else
            {{ moteur }} tag "$img" "$retour"
          fi
        fi
      args:
        executable: /bin/bash
      changed_when: false

    - name: Démarrer ou mettre à jour
      ansible.builtin.command:
        cmd: "{{ commande_compose }} up -d"
        chdir: "{{ app_dir }}"
      changed_when: true

    - name: Attendre que l'application réponde
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ port_local }}{{ chemin_sante }}"
        status_code: 200
      register: sante
      retries: 10
      delay: 3
      until: sante.status == 200

    - name: Poser le vhost nginx (option)
      ansible.builtin.copy:
        src: "{{ app_dir }}/{{NOM}}.conf"
        dest: "{{ vhost_dir | default('/etc/nginx/conf.d') }}/{{DOMAINE}}.conf"
        remote_src: true
        mode: "0644"
      register: vhost
      when: deploy_vhost | bool

    # Sans vhost posé, nginx n'est pas touché (le serveur peut même ne pas l'avoir).
    - name: Tester la configuration nginx
      ansible.builtin.command: nginx -t
      register: test_nginx
      changed_when: false
      failed_when: false
      when: deploy_vhost | bool

    - name: Arrêt si la configuration nginx est invalide
      ansible.builtin.assert:
        that: test_nginx.rc == 0
        fail_msg: >-
          Le vhost a été copié dans {{ vhost_dir | default('/etc/nginx/conf.d') }}/{{DOMAINE}}.conf mais nginx n'a PAS été
          rechargé, car « nginx -t » échoue (sortie : {{ test_nginx.stderr | default('') | trim }}).
          Corriger la configuration, puis relancer ce playbook. Si le vhost n'a pas changé entre-temps, le playbook ne
          recharge pas nginx : le faire alors à la main (nginx -s reload).
      when: deploy_vhost | bool

    - name: Recharger nginx (seulement si le vhost a changé)
      ansible.builtin.command: nginx -s reload
      changed_when: true
      when: deploy_vhost | bool and vhost is changed

    - name: Rappel
      ansible.builtin.debug:
        msg: >-
          Déploiement de {{ app_nom }} {{ app_version }} terminé. Lancer maintenant playbook_check.yaml, puis inscrire
          l'application dans la supervision (sauvegarde, restauration, chef de projet), essayer une restauration et
          mettre à jour le schéma d'infrastructure du serveur. Retour arrière : voir procedure-installation.md.
