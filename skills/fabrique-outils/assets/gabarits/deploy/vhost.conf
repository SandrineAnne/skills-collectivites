# {{TITRE}} — vhost nginx (un fichier par application)
# L'emplacement diffère selon le serveur : le vérifier avec « nginx -T »
# (serveur de production : /etc/nginx/conf.d/ ; serveur de test : /etc/nginx/sites-enabled/<hôte>.conf).
server {
    listen 443 ssl;
    server_name {{DOMAINE}};

    ssl_certificate     /etc/nginx/certs/À-COMPLÉTER.crt;   # à adapter au serveur
    ssl_certificate_key /etc/nginx/certs/À-COMPLÉTER.key;

    # Réseau interne uniquement (adapter au plan d'adressage ; une ouverture externe est une décision écrite dans la SPEC)
    allow 10.0.0.0/8;
    deny all;

    client_max_body_size 20m;                                # adapter à la taille des fichiers déposés

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; frame-ancestors 'none'" always;

    location / {
        proxy_pass http://127.0.0.1:{{PORT}};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
